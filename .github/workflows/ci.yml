name: rodlog CI
on:
  push:
    branches: [main, feat/standalone-foundation]
  pull_request:
  workflow_dispatch:
concurrency:
  group: rodlog-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash scripts/test-shell-hook.sh
      - run: go build ./cmd/rodlog
