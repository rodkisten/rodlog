name: rodlog CI
on:
  push:
    branches: [main, feat/standalone-foundation]
  pull_request:
  workflow_dispatch:
concurrency:
  group: rodlog-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify committed Go module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum
      - name: Build rodlog
        run: go build -o "$RUNNER_TEMP/rodlog" ./cmd/rodlog
      - name: Static analysis
        run: '"$RUNNER_TEMP/rodlog" exec --color=always -- go vet ./...'
      - name: Tests (verbose, colored, race detector)
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/rodlog" exec --color=always -- go test -v -race -count=1 ./... |
            awk '{
              if ($0 ~ /\x1b\[/) print
              else if ($0 ~ /--- PASS:|^PASS$|^ok[[:space:]]/) printf "\033[32m%s\033[0m\n", $0
              else if ($0 ~ /--- FAIL:|^FAIL/) printf "\033[31m%s\033[0m\n", $0
              else if ($0 ~ /--- SKIP:/) printf "\033[33m%s\033[0m\n", $0
              else if ($0 ~ /=== RUN/) printf "\033[36m%s\033[0m\n", $0
              else print
              fflush()
            }'
      - name: TypeScript intelligence adapter
        shell: bash
        run: |
          set -euo pipefail
          node --check cmd/rodlog/typescript-intelligence.mjs
          empty_dir="$(mktemp -d)"
          output="$(cd "$empty_dir" && node "$GITHUB_WORKSPACE/cmd/rodlog/typescript-intelligence.mjs" 2>&1 || true)"
          printf '%s\n' "$output"
          grep -q '"code":"RODLOGTS001"' <<<"$output"
          ! grep -q 'Require stack:' <<<"$output"
      - name: "TypeScript intelligence: huge real project fixture"
        shell: bash
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/testdata/typescript-intelligence"
          npm install --prefix "$fixture" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@latest @typescript/typescript6@latest

          set +e
          "$RUNNER_TEMP/rodlog" tsc             --project "$fixture/tsconfig.json"             --color=always             --links=never             --context-before=1             --context-after=1             > "$RUNNER_TEMP/typescript-intelligence.log" 2>&1
          status=$?
          set -e

          cat "$RUNNER_TEMP/typescript-intelligence.log"
          test "$status" -eq 1

          diagnostics="$(grep -Ec 'TS[0-9]+' "$RUNNER_TEMP/typescript-intelligence.log" || true)"
          test "$diagnostics" -ge 30

          grep -q 'TS2322' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'TS2345' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'TS2769\|TS2554' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'Defined here\|declared here' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'errors-assignments.ts' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'errors-generics.ts' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'errors-control-flow.ts' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'expects this parameter' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'must satisfy this constraint' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'Quick fix' "$RUNNER_TEMP/typescript-intelligence.log"
          grep -q 'toUpperCase\|toFixed\|Implement interface' "$RUNNER_TEMP/typescript-intelligence.log"

          printf '\nValidated %s rendered TypeScript diagnostic references from the huge fixture.\n' "$diagnostics"
      - name: "TypeScript intelligence: huge JSON transport through Docker"
        shell: bash
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/testdata/typescript-intelligence"
          bash -n scripts/build-docker-typescript-fixture.sh

          scripts/build-docker-typescript-fixture.sh             "$RUNNER_TEMP/rodlog"             "$fixture/tsconfig.json"             "$RUNNER_TEMP/docker-typescript-intelligence.log"

          diagnostics="$(grep -Ec '"code":"TS[0-9]+"' "$RUNNER_TEMP/docker-typescript-intelligence.log" || true)"
          test "$diagnostics" -ge 30

          "$RUNNER_TEMP/rodlog"             --color=always             --theme=tokyo-night             --syntax-profile=truecolor             --mode=transform             --tool=auto             --detail=normal             --symbols=unicode             < "$RUNNER_TEMP/docker-typescript-intelligence.log"             | tee "$RUNNER_TEMP/docker-typescript-rendered.log"

          rendered="$RUNNER_TEMP/docker-typescript-rendered.log"
          grep -q 'TS2322' "$rendered"
          grep -q 'TS2345' "$rendered"
          grep -q 'TS2769\|TS2554' "$rendered"
          grep -q 'Defined here\|declared here' "$rendered"
          grep -q 'expects this parameter' "$rendered"
          grep -q 'must satisfy this constraint' "$rendered"
          grep -q 'Expected property\|property .* expects this type' "$rendered"
          grep -q 'Return type\|function returns this type' "$rendered"
          grep -q 'errors-generics.ts' "$rendered"
          grep -q 'errors-control-flow.ts' "$rendered"
          grep -q 'Quick fix' "$rendered"
          grep -q 'toUpperCase\|toFixed\|Implement interface' "$rendered"

          printf '\nValidated %s enriched TypeScript diagnostics through the Docker transport.\n' "$diagnostics"

      - name: Shell hook checks
        run: '"$RUNNER_TEMP/rodlog" exec --color=always -- bash scripts/test-shell-hook.sh'
      - name: "Fixture preview: npm"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/rodlog"
          "$RUNNER_TEMP/rodlog" --color=always --tool=npm --output=terminal < testdata/npm.log
      - name: "Fixture preview: pnpm"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/rodlog"
          "$RUNNER_TEMP/rodlog" --color=always --mode=transform --tool=pnpm --output=terminal < testdata/pnpm.log
      - name: "Fixture preview: docker"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/rodlog"
          "$RUNNER_TEMP/rodlog" --color=always --tool=docker --output=terminal < testdata/docker.log
      - name: "Fixture preview: Docker nested pnpm + TypeScript"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/rodlog"
          "$RUNNER_TEMP/rodlog" --color=always --mode=transform --tool=auto --detail=compact < testdata/docker-pnpm.log
      - name: "Fixture preview: typescript"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/rodlog"
          "$RUNNER_TEMP/rodlog" --color=always --mode=transform --tool=typescript --output=terminal < testdata/typescript.log
      - name: "Fixture preview: Rust compiler JSON"
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/rodlog" --mode=transform --color=always --tool=rust < testdata/rust.jsonl'
      - name: "Fixture preview: Go compiler"
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/rodlog" --mode=transform --color=always --tool=go < testdata/go.log'
      - name: Embedded demos
        run: '"$RUNNER_TEMP/rodlog" demo all'
  publish-preview:
    needs: validate
    if: github.ref == 'refs/heads/feat/standalone-foundation' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build portable binaries
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/rodlog-$os-$arch" ./cmd/rodlog
            done
          done
          (cd dist && sha256sum rodlog-* > SHA256SUMS)
      - name: Publish immutable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="preview-$GITHUB_SHA"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --latest=false --title "Preview $GITHUB_SHA"
          fi
